<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simon Game</title>
  <link rel="stylesheet" href="miniproject.css" />
</head>
<body>
  <h1>Simon Game</h1>

  <p id="status">Press Start to Play</p>
  <h2>Level: <span id="level">0</span></h2>

  <div class="board">
    <button class="pad green" data-color="green"></button>
    <button class="pad red" data-color="red"></button>
    <button class="pad yellow" data-color="yellow"></button>
    <button class="pad blue" data-color="blue"></button>
  </div>

  <button id="startBtn">Start Game</button>
  <button id="restartBtn">Restart</button>
  

  <script src="miniprojectr.js"></script>
</body>
</html>
